<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (function() {
            const hasCookieToken = document.cookie.split(';').some(c => c.trim().startsWith('token='));
            const localUser = localStorage.getItem('currentUser');
            const isStandalone = window.location.protocol === 'file:' || !hasCookieToken;
            if (isStandalone && !localUser) {
                window.location.href = 'login page.html';
            }
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Page</title>
    <link rel="stylesheet" href="css/navbar.css">
    <style>
        /* Resetting some default styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Full viewport height for the body */
        body, html {
            height: 100%;
            font-family: 'Arial', sans-serif;
        }

        /* Background image with a gradient overlay */
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('assets/neon_teal_bg.jpg') no-repeat center center / cover;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* Gradient overlay */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 3, 5, 0.75); /* Deep dark overlay */
            z-index: 1;
        }

        /* Centered container for the welcome message */
        .container {
            z-index: 2; /* Ensures text is above the overlay */
            color: #ffffff;
            font-size: 1.7rem;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.25);
            font-family: 'Poppins', 'Segoe UI', Arial, sans-serif;
            padding: 40px;
            background: rgba(12, 12, 14, 0.85); /* Darker glassmorphic background */
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 242, 254, 0.25);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6), 0 0 25px rgba(0, 242, 254, 0.15);
            max-width: 80%;
            transition: all 0.3s ease-in-out;
        }

        /* Styling the heading */
        h1 {
            font-size: 5rem;
            font-weight: 800;
            margin-bottom: 20px;
            color: #00f2fe;
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.6);
            letter-spacing: 2px;
        }

        /* Button for interaction */
        .btn {
            padding: 12px 28px;
            background: linear-gradient(90deg, #00b4db, #00f2fe);
            color: #050d12;
            border: none;
            border-radius: 8px;
            text-transform: uppercase;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: large;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.25);
        }

        .btn:hover {
            background: linear-gradient(90deg, #00f2fe, #00b4db);
            box-shadow: 0 4px 20px rgba(0, 242, 254, 0.55);
            transform: translateY(-2px);
        }

        .btn:focus {
            outline: none;
        }

        /* Animating the container */
        .container:hover {
            transform: scale(1.02); /* Slight scale-up effect on hover */
            border-color: rgba(0, 242, 254, 0.5);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), 0 0 35px rgba(0, 242, 254, 0.3);
        }
    </style>
</head>
<body>

    <div class="background">
        <div class="overlay"></div>
        <div class="container">
            <h1>WELCOME!</h1>
            <br>
            <br>
            <p>The AI that makes your resume so convincing that even your mother will think you're qualified!</p>
            <br>
            <p>Make & adapt your resume to any jobs on the web in one click!</p>
            <br>
            <a href="templates.html">
                <button class="btn">Import Exciting Resume</button>
                <br>
            </a>
        </div>
    </div>
    <script src="js/navbar.js"></script>
</body>
</html>
