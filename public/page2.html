<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next Page</title>
    <style>
        /* Resetting some default styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Full viewport height for the body */
        body, html {
            height: 100%;
            font-family: 'Arial', sans-serif;
        }

        /* Background image with a gradient overlay */
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:url('assets/black.jpg');
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            filter: brightness(80%); /* Darkens the background */
        }

        /* Gradient overlay */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(133, 132, 132, 0.4); /* Semi-transparent black */
            z-index: 1;
        }

        /* Centered container for the welcome message */
        .container {
            z-index: 2; /* Ensures text is above the overlay */
            color: rgb(255, 253, 253);
            font-size:1.7rem;
            text-shadow: 2px 2px 10px rgba(117, 117, 117, 0.6); /* Soft shadow to make text readable */
            font-family:Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            padding: 30px;
            background-color: rgba(161, 159, 159, 0.5); /* Slight dark background behind the text */
            border-radius: 15px;
            max-width: 80%;
            transition: transform 0.3s ease-in-out;
        }

        /* Styling the heading */
        h1 {
            font-size: 6rem;
            font-style: italic;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* Button for interaction */
        .btn {
            padding: 10px 20px;
            background-color: #080a0c;
            color: rgb(255, 255, 255);
            border: none;
            border-radius: 8px;
            text-transform: uppercase;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
            font-size:large;
        }

        .btn:hover {
            background-color: #406dc0;
        }

        .btn:focus {
            outline: none;
        }

        /* Animating the container */
        .container:hover {
            transform: scale(1.05); /* Slight scale-up effect on hover */
        }
    </style>
</head>
<body>

    <div class="background">
        <div class="overlay"></div>
        <div class="container">
            <h1>WELCOME!</h1>
            <br>
            <br>
            <p>The AI that makes your resume so convincing that even your mother will think you're qualified!</p>
            <br>
            <p>Make & adapt your resume to any jobs on the web in one click!</p>
            <br>
            <a href="templates.html">
                <button class="btn">Import Exciting Resume</button>
                <br>
            </a>
        </div>
    </div>

</body>
</html>
