<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN PAGE</title>
    <link rel="stylesheet" href="css/page1.css">
</head>
<body>
<div id="container" class="container">
    <!-- FORM SECTION -->
    <div class="row">
        <!-- SIGN UP -->
        <div class="col align-items-center flex-col sign-up">
            <div class="form-wrapper align-items-center">
                <div class="form sign-up">
                    <h2 class="form-title">Join with us <span class="sparkle">✨</span></h2>
                    <div class="input-group">
                        <i class='bx bxs-user'></i>
                        <input type="text" id="signup-username" placeholder="Username">
                    </div>
                    <div class="input-group">
                        <i class='bx bx-mail-send'></i>
                        <input type="email" id="signup-email" placeholder="Email">
                    </div>
                    <div class="input-group">
                        <i class='bx bxs-lock-alt'></i>
                        <input type="password" id="signup-password" placeholder="Password">
                    </div>
                    <div class="input-group">
                        <i class='bx bxs-lock-alt'></i>
                        <input type="password" id="signup-confirm-password" placeholder="Confirm password">
                    </div>
                    <div id="signup-error" class="error-msg" style="color: #ff4d4d; margin-bottom: 10px; font-weight: bold; text-align: center;"></div>
                    <button id="signup-btn">
                       Sign Up
                    </button>
                    <p>
                        <span>
                            Already have an account?
                        </span>
                        <b onclick="toggle()" class="pointer">
                            Sign in here
                        </b>
                    </p>
                </div>
            </div>
        
        </div>
        <!-- END SIGN UP -->
        <!-- SIGN IN -->
        <div class="col align-items-center flex-col sign-in">
            <div class="form-wrapper align-items-center">
                <div class="form sign-in">
                    <h2 class="form-title">Welcome <span class="wave-emoji">👋</span></h2>
                    <div class="input-group">
                        <i class='bx bxs-user'></i>
                        <input type="text" id="signin-username" placeholder="Username">
                    </div>
                    <div class="input-group">
                        <i class='bx bxs-lock-alt'></i>
                        <input type="password" id="signin-password" placeholder="Password">
                    </div>
                    <div id="signin-error" class="error-msg" style="color: #ff4d4d; margin-bottom: 10px; font-weight: bold; text-align: center;"></div>
                    <button id="signin-btn">
                    Sign In
                    </button>
                    <p>
                        <b class="pointer forgot-pw">
                            Forgot password?
                        </b>
                    </p>
                    <p>
                        <span>
                            Don't have an account?
                        </span>
                        <b onclick="toggle()" class="pointer">
                            Sign up here
                        </b>
                    </p>
                </div>
            </div>
            <div class="form-wrapper">
    
            </div>
        </div>
        <!-- END SIGN IN -->
    </div>
    <!-- END FORM SECTION -->
    <!-- CONTENT SECTION -->
    <div class="row content-row">
        <!-- SIGN IN CONTENT -->
        <div class="col align-items-center flex-col">
            <div class="text sign-in">
            <h2>
               Resume<br>
               Spark!
            </h2>
            <p>
               Light up your career path with a perfect resume.
            </p>
            </div>
            <div class="img sign-in">
    
            </div>
        </div>
        <!-- END SIGN IN CONTENT -->
        <!-- SIGN UP CONTENT -->
        <div class="col align-items-center flex-col">
            <div class="img sign-up">
            
            </div>
            <div class="text sign-up">
                <h2>
                Create.<br>
                Connect.<br>
                <span class="highlight">Grow.</span>
                </h2>
                <p>
                Join our community and explore endless opportunities.
                </p>
            </div>
        </div>
        <!-- END SIGN UP CONTENT -->
    </div>
    <!-- END CONTENT SECTION -->
</div>
<script src="js/page1.js">
    
</script>
</body>
</HTML>
